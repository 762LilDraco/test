<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BitLife Clone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- CHARACTER CREATION -->
<div id="creation">
    <h1>Create Your Character</h1>
    <input type="text" id="charName" placeholder="Name">
    <select id="charGender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>
    <input type="text" id="charNationality" placeholder="Nationality">
    <button id="createBtn">Start Life</button>
</div>

<!-- GAME INTERFACE -->
<div id="game" style="display:none;">
    <div id="charPanel">
        <h2 id="charInfo"></h2>
        <p>Age: <span id="age">0</span></p>
        <p>Happiness: <span id="happiness">50</span></p>
        <p>Health: <span id="health">50</span></p>
        <p>Smarts: <span id="smarts">50</span></p>
        <p>Looks: <span id="looks">50</span></p>
        <p>Money: $<span id="money">1000</span></p>
        <button id="nextYearBtn">Next Year</button>
    </div>
    <div id="events" class="eventsPanel"></div>
</div>

<script src="script.js"></script>
</body>
</html>
